<!DOCTYPE html>
<html>
<head>
<style>
  body { background: white; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 245" width="300" height="368">
<defs>
<style>
  .ink { fill: #1a0f0a; }

  @keyframes bob {
    0%, 100% { transform: translateY(0px); }
    50%       { transform: translateY(-5px); }
  }
  @keyframes leg-l {
    0%, 100% { transform: rotate(22deg); }
    50%       { transform: rotate(-22deg); }
  }
  @keyframes leg-r {
    0%, 100% { transform: rotate(-22deg); }
    50%       { transform: rotate(22deg); }
  }
  @keyframes arm-r {
    0%, 100% { transform: rotate(-8deg); }
    50%       { transform: rotate(10deg); }
  }

  #body-group { animation: bob 0.8s ease-in-out infinite; }

  #leg-l-g {
    transform-box: fill-box;
    transform-origin: 50% 0%;
    animation: leg-l 0.8s ease-in-out infinite;
  }
  #leg-r-g {
    transform-box: fill-box;
    transform-origin: 50% 0%;
    animation: leg-r 0.8s ease-in-out infinite;
  }
  #arm-r-g {
    transform-box: fill-box;
    transform-origin: 0% 30%;
    animation: arm-r 1.6s ease-in-out infinite;
  }
</style>
</defs>

<!-- Ground rays (static) -->
<line x1="100" y1="218" x2="26"  y2="243" stroke="#1a0f0a" stroke-width="3.5" stroke-linecap="round"/>
<line x1="100" y1="218" x2="50"  y2="244" stroke="#1a0f0a" stroke-width="3.5" stroke-linecap="round"/>
<line x1="100" y1="218" x2="76"  y2="245" stroke="#1a0f0a" stroke-width="3.5" stroke-linecap="round"/>
<line x1="100" y1="218" x2="100" y2="245" stroke="#1a0f0a" stroke-width="3.5" stroke-linecap="round"/>
<line x1="100" y1="218" x2="124" y2="245" stroke="#1a0f0a" stroke-width="3.5" stroke-linecap="round"/>
<line x1="100" y1="218" x2="150" y2="244" stroke="#1a0f0a" stroke-width="3.5" stroke-linecap="round"/>
<line x1="100" y1="218" x2="174" y2="243" stroke="#1a0f0a" stroke-width="3.5" stroke-linecap="round"/>

<!-- Everything that bobs -->
<g id="body-group">

  <!-- LEGS drawn first (behind torso) -->
  <g id="leg-l-g">
    <path class="ink" d="M 83,155 C 81,170 77,190 73,212 L 85,214 C 88,192 92,172 94,157 Z"/>
    <!-- Left boot -->
    <path class="ink" d="M 70,210 Q 68,218 82,219 Q 96,218 94,210 Z"/>
  </g>
  <g id="leg-r-g">
    <path class="ink" d="M 108,155 C 110,170 114,190 118,212 L 130,210 C 126,188 122,168 118,157 Z"/>
    <!-- Right boot -->
    <path class="ink" d="M 116,210 Q 114,218 128,219 Q 142,218 140,210 Z"/>
  </g>

  <!-- BASKET (left/back side) -->
  <!-- Main basket body -->
  <path class="ink" d="
    M 36,92
    C 32,100 29,120 31,142
    C 33,158 40,166 54,167
    L 84,167
    C 92,166 96,158 96,144
    C 98,124 96,100 93,92
    Z
  "/>
  <!-- Horizontal weave cuts (white) -->
  <line x1="32" y1="109" x2="95" y2="109" stroke="white" stroke-width="2.8"/>
  <line x1="31" y1="124" x2="95" y2="124" stroke="white" stroke-width="2.8"/>
  <line x1="31" y1="139" x2="95" y2="139" stroke="white" stroke-width="2.8"/>
  <line x1="33" y1="153" x2="95" y2="153" stroke="white" stroke-width="2.8"/>
  <!-- Vertical weave cuts (white) -->
  <line x1="46" y1="92" x2="43" y2="166" stroke="white" stroke-width="1.8"/>
  <line x1="59" y1="92" x2="58" y2="166" stroke="white" stroke-width="1.8"/>
  <line x1="72" y1="92" x2="71" y2="167" stroke="white" stroke-width="1.8"/>
  <line x1="83" y1="92" x2="84" y2="167" stroke="white" stroke-width="1.8"/>
  <!-- Basket rim -->
  <path class="ink" d="M 36,92 C 35,85 42,81 63,81 C 85,81 96,85 93,92 C 86,88 78,86 63,86 C 46,86 38,88 36,92 Z"/>

  <!-- Produce / harvest in basket top -->
  <circle class="ink" cx="42" cy="79" r="7.5"/>
  <circle class="ink" cx="55" cy="74" r="9"/>
  <circle class="ink" cx="69" cy="73" r="8.5"/>
  <circle class="ink" cx="81" cy="77" r="7"/>
  <!-- Leaf details on produce -->
  <path class="ink" d="M 55,65 C 52,56 46,52 42,55 C 40,60 46,66 53,66 Z"/>
  <path class="ink" d="M 55,65 C 58,56 64,52 67,57 C 67,62 61,67 55,66 Z"/>
  <path class="ink" d="M 69,64 C 72,55 79,52 81,57 C 81,63 75,67 69,66 Z"/>

  <!-- LEFT ARM wrapping around basket -->
  <path class="ink" d="M 82,102 C 70,112 56,126 44,140 C 40,145 43,153 50,149 C 62,136 76,120 86,108 Z"/>

  <!-- TORSO -->
  <path class="ink" d="
    M 82,90
    C 77,97 75,114 77,134
    C 79,149 83,157 90,159
    L 116,159
    C 123,157 127,149 129,134
    C 131,114 129,97 124,90
    Z
  "/>

  <!-- RIGHT ARM + PLANT -->
  <g id="arm-r-g">
    <!-- Arm -->
    <path class="ink" d="M 124,102 C 138,111 154,119 167,123 C 171,125 172,133 167,131 C 154,127 138,119 122,109 Z"/>
    <!-- Stem -->
    <path fill="none" stroke="#1a0f0a" stroke-width="3" stroke-linecap="round"
          d="M 165,127 C 169,118 172,110 174,100"/>
    <!-- Branch left -->
    <path fill="none" stroke="#1a0f0a" stroke-width="2.5" stroke-linecap="round"
          d="M 170,114 C 165,108 161,102 162,96"/>
    <!-- Leaf 1 (top right) -->
    <path class="ink" d="M 174,100 C 178,90 188,86 190,93 C 190,100 183,105 174,102 Z"/>
    <!-- Leaf 2 (top left) -->
    <path class="ink" d="M 174,100 C 168,90 162,84 165,78 C 169,74 177,82 176,96 Z"/>
    <!-- Leaf 3 (branch) -->
    <path class="ink" d="M 162,96 C 155,90 152,82 156,78 C 160,76 166,84 164,94 Z"/>
    <!-- Leaf 4 (branch lower) -->
    <path class="ink" d="M 162,96 C 170,90 178,90 178,96 C 178,102 170,104 162,98 Z"/>
    <!-- Berries/cherries -->
    <circle class="ink" cx="180" cy="100" r="4.5"/>
    <circle class="ink" cx="188" cy="94" r="3.5"/>
    <circle class="ink" cx="168" cy="84" r="3.5"/>
    <circle class="ink" cx="157" cy="80" r="3"/>
  </g>

  <!-- HEAD -->
  <ellipse class="ink" cx="100" cy="70" rx="17" ry="20"/>

  <!-- HAT BRIM (wide, floppy) -->
  <path class="ink" d="
    M 52,56
    C 50,50 58,45 100,45
    C 142,45 150,50 148,56
    C 148,63 140,67 100,67
    C 60,67 52,63 52,56
    Z
  "/>
  <!-- Dip/crease in hat brim on sides -->
  <path fill="white" d="M 54,58 C 56,62 66,65 100,65 C 134,65 144,62 146,58 C 144,61 134,63 100,63 C 66,63 56,61 54,58 Z"/>

  <!-- HAT CROWN -->
  <path class="ink" d="
    M 72,55
    C 70,44 72,26 76,17
    C 80,10 88,6 100,6
    C 112,6 120,10 124,17
    C 128,26 130,44 128,55
    Z
  "/>

  <!-- Hat band (light stripe) -->
  <path fill="white" d="
    M 74,42 C 74,37 82,34 100,34 C 118,34 126,37 126,42
    C 126,45 118,47 100,47 C 82,47 74,45 74,42 Z
  "/>
  <path class="ink" d="
    M 75,43 C 75,39 83,37 100,37 C 117,37 125,39 125,43
    C 125,46 117,47 100,47 C 83,47 75,46 75,43 Z
  "/>

</g>
</svg>
</body>
</html>
